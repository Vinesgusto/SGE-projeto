{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Confirmar Exclusão</h2>
    <p>Tem certeza que deseja excluir a marca "{{ object.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Excluir</button>
        <a href="{% url 'supplier_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
