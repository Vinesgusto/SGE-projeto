{% extends 'base.html' %}

{% block title %}SGE - Detalhes da Saída{% endblock %}

{% block content %}

<div class="container mt-4">
    <h3 class="display-6">Detalhes da Saída</h3>
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">{{ object.product }}</h5>
            <p class="card-text">Quantidade:<strong>{{ object.supplier }}</strong></p>
            <p class="card-text">{{ object.description }}</p>
        </div>
    </div>
     <a href="{% url 'outflow_list' %}" class="btn btn-secondary mt-4">Voltar</a>


    
</div>

{% endblock %}
