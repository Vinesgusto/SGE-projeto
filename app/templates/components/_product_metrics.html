
<div class ="card mt-4">
  <div class="card-body">
    <div class = "row">

    
        <div class="col-md-3">
            <div class="card bg-primary">
                <div class="card-body text-white">
                    <h5 class="card-title">Total de Produtos</h5>
                    <p class="card-text fs-4">{{ product_metrics.total_quantity }}</p>
                </div>
            </div> 
        </div>
    
        <div class="col-md-3">
            <div class="card bg-danger">
                <div class="card-body text-white">
                    <h5 class="card-title">Custo de Estoque</h5>
                    <p class="card-text fs-4">R$ {{ product_metrics.total_cost_price|floatformat:2 }}</p>
                </div>
            </div> 
        </div> 
        
        <div class="col-md-3"> 
            <div class="card bg-success">
                <div class="card-body text-white">
                    <h5 class="card-title">Valor Total do Estoque</h5>
                    <p class="card-text fs-4">R$ {{ product_metrics.total_selling_price|floatformat:2 }}</p>
                </div>
            </div> 
        </div> 
             
        
        <div class="col-md-3">
            <div class="card bg-warning">
                <div class="card-body text-white">
                    <h5 class="card-title">Lucro do Estoque</h5>
                    <p class="card-text fs-4">R$ {{ product_metrics.total_profit|floatformat:2 }}</p>
                </div>
            </div>
        </div>    
     </div>
  </div>
</div>
