{% extends 'base.html' %}

{% block content %}


<div class="row mb-3">

    <div class="col-md-6">
        <form method="get" action="{% url 'category_list' %}">
            <div class="input-group">
                <input type="text" name="name" class="form-control" placeholder="Nome" value="{{ request.GET.name }}">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </form>
    </div>

    <div class="col-md-6">
        <a href="{% url 'category_create' %}" class="btn btn-success float-end">
            <i class="bi bi-plus-lg"></i> Adicionar Categoria
        </a>
    </div>
</div>

<h3 class="display-8">Categorias</h3>

<div class="table-responsive">
    <table class="table table-striped table-bordered">
        <thead class="thead-dark">
            <tr>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for category in categories %}
            <tr>  
                <td>{{ category.name }}</td>
                <td>{{ category.description }}</td>
                <td>
                    <a href="{% url 'category_detail' category.id %}" class="btn btn-info btn-sm">
                        <i class="bi-eye"></i>
                    </a>
                    <a href="{% url 'category_update' category.id %}" class="btn btn-warning btn-sm">
                        <i class="bi bi-pencil-square"></i>
                    </a>
                    <a href="{% url 'category_delete' category.id %}" class="btn btn-danger btn-sm">
                        <i class="bi bi-trash3-fill"></i>
                    </a>
                </td>                
            </tr>
                {% empty %}
            {% endfor %}
    </table>
</div>

{% include 'components/_pagination.html' %}
{% endblock %}
