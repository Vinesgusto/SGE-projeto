{% extends 'base.html' %}

{% block title %}

SGE - Marcas

{% endblock %}

{% block content %}

<div class="row mb-3">

    <div class="col-md-6">
        <form method="get" action="{% url 'brand_list' %}">
            <div class="input-group">
                <input type="text" name="name" class="form-control" placeholder="Nome" value="{{ request.GET.name }}">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </form>
    </div>

    <div class="col-md-6">
        <a href="{% url 'brand_create' %}" class="btn btn-success float-end">
            <i class="bi bi-plus-lg"></i> Adicionar Marca
        </a>
    </div>
</div>

<h3 class="display-8">Marcas</h3>

<div class="table-responsive">
    <table class="table table-striped table-bordered">
        <thead class="thead-dark">
            <tr>

                <th>Nome</th>
                <th>Descrição</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for brand in brands %}
            <tr>

                <td>{{ brand.name }}</td>
                <td>{{ brand.description }}</td>
                <td>
                    <a href="{% url 'brand_detail' brand.id %}" class="btn btn-info btn-sm">
                        <i class="bi-eye"></i>
                    </a>
                    <a href="{% url 'brand_update' brand.id %}" class="btn btn-warning btn-sm">
                        <i class="bi bi-pencil-square"></i>
                    </a>
                    <a href="{% url 'brand_delete' brand.id %}" class="btn btn-danger btn-sm">
                        <i class="bi bi-trash3-fill"></i>
                    </a>
                </td>
            </tr>
            {% empty %}

            {% endfor %}
        </tbody>
    </table>

</div>
{% include 'components/_pagination.html' %}

{% endblock %}
